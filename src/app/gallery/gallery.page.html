<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cámara de fotos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (photoService.photos().length === 0) {
    <p class="empty">Aún no hay fotos. Toca el botón de la cámara para tomar una.</p>
  }

  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos(); track photo.filepath) {
        <ion-col size="6">
          <ion-img [src]="photo.webviewPath" (click)="showActionSheet(photo)"></ion-img>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()" aria-label="Tomar fotografía">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
